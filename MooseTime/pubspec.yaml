name: moose_time
description: MooseTime mobile application
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.0
  http: ^1.6.0
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.0.0
  package_info_plus: ^8.3.1
  file_selector: ^1.1.0
  share_plus: ^12.0.2
  super_clipboard: ^0.9.1
  url_launcher: ^6.3.2
  in_app_purchase: ^3.2.3
  
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    
